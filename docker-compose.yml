# SmartFood — MVP: cardápio digital público por loja
#
# `docker compose up` sobe: Postgres, backend (Express) e frontend (Vite/React servido estático),
# com o backend rodando a migration do Prisma antes de subir a API.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartfood}
      POSTGRES_DB: ${POSTGRES_DB:-smartfood}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - smartfood_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smartfood}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    volumes:
      - smartfood_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-3000}:3000'

volumes:
  smartfood_postgres_data:
  smartfood_uploads:
