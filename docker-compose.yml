# SmartFood — Smart Starter Kit (Missão 0008)
#
# `docker compose up` deve deixar de pé: Postgres, backend (NestJS) e frontend (Next.js),
# com o backend rodando a migration do Prisma antes de subir a API.
# Nenhum serviço aqui expõe funcionalidade de negócio — só a fundação técnica.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartfood}
      POSTGRES_DB: ${POSTGRES_DB:-smartfood}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - smartfood_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smartfood}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '${BACKEND_PORT:-3001}:3001'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - '${FRONTEND_PORT:-3000}:3000'

volumes:
  smartfood_postgres_data:
