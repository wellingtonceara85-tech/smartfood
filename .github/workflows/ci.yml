name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DATABASE_URL: postgresql://smartfood:smartfood@localhost:5432/smartfood
  JWT_SECRET: ci-only-secret-nao-usar-fora-do-pipeline
  VITE_API_URL: http://localhost:3001

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartfood
          POSTGRES_PASSWORD: smartfood
          POSTGRES_DB: smartfood
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartfood"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do backend
        run: npm install
        working-directory: backend

      - name: Instalar dependências do frontend
        run: npm install
        working-directory: frontend

      - name: Gerar Prisma Client
        run: npm run prisma:generate
        working-directory: backend

      - name: Aplicar migrations no Postgres do CI
        run: npm run prisma:deploy
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
